set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 10
set -g mouse on

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Set catppuccin flavour from ~/.config/theme (dark=mocha, light=latte)
if-shell '[ "$(cat ~/.config/theme 2>/dev/null)" = "light" ]' \
    'set -g @catppuccin_flavour "latte"' \
    'set -g @catppuccin_flavour "mocha"'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
# Guard against resurrect clobbering `last` with an empty save (crashes restore on boot).
# Three layers, because an empty `last` makes tmux exit ~1.6s into boot:
#   1. post-save-layout, in-server only. resurrect resolves hooks via
#      `tmux show-option`, so this silently no-ops when the server is already
#      gone -- i.e. it does NOT cover the shutdown race. Kept for the rarer
#      server-alive-but-no-panes case.
#   2. save-and-verify.sh, wired as the systemd ExecStop, validates from outside
#      tmux after every save. This is the one that covers the shutdown race.
#   3. pre-restore-all, last line of defence: repairs `last` before restore reads
#      it, so a bad save can never take the boot session down.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/guard-empty-resurrect.sh'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-pre-restore-all '~/.config/tmux/scripts/repair-resurrect-last.sh'

# Auto-install plugins on first run
if "test ! -d ~/.config/tmux/plugins/tmux-yank" \
   "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

# Must come AFTER tpm: resurrect sets this option itself at plugin load and would
# otherwise clobber it. Routes continuum's periodic autosave through the same
# validation the systemd ExecStop uses, so no save path can leave `last` empty.
set -g @resurrect-save-script-path '~/.config/tmux/scripts/save-and-verify.sh'
